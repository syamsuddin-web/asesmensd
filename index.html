        const { useState, useEffect, useRef } = React;

        // --- WEB AUDIO API SOUND SYNTHESIZER ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playCorrect() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.25);
                });
            }

            playWrong() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playClick() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playFanfare() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const notes = [392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
                    
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.12 + 0.4);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.12);
                    osc.stop(this.ctx.currentTime + idx * 0.12 + 0.4);
                });
            }
        }

        // --- MODUL 1: KUIS KILAT COMPONENT ---
        function QuizModule({ user, onQuizComplete, quizScore, quizCompleted }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(25);
            const [streak, setStreak] = useState(0);

            const timerRef = useRef(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [currentIndex, isSubmitted, quizCompleted]);

            // Timer management
            useEffect(() => {
                if (quizCompleted || isSubmitted) return;

                setTimeLeft(25);
                timerRef.current = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timerRef.current);
                            handleTimeout();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timerRef.current);
            }, [currentIndex, isSubmitted, quizCompleted]);

            const handleTimeout = () => {
                setIsSubmitted(true);
                sound.playWrong();
                setStreak(0);
            };

            const handleSelectOption = (idx) => {
                if (isSubmitted) return;
                sound.playClick();
                setSelectedOption(idx);
            };

            const handleAnswerSubmit = () => {
                if (selectedOption === null || isSubmitted) return;
                clearInterval(timerRef.current);
                setIsSubmitted(true);

                const currentQ = QUIZ_QUESTIONS[currentIndex];
                if (selectedOption === currentQ.correct) {
                    sound.playCorrect();
                    const streakBonus = streak * 2;
                    const questionPoints = 10 + streakBonus;
                    setScore(prev => prev + questionPoints);
                    setStreak(prev => prev + 1);
                } else {
                    sound.playWrong();
                    setStreak(0);
                }
            };

            const handleNextQuestion = () => {
                sound.playClick();
                if (currentIndex < QUIZ_QUESTIONS.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedOption(null);
                    setIsSubmitted(false);
                } else {
                    // Finalize Quiz
                    const finalScore = score;
                    onQuizComplete(finalScore);
                    sound.playFanfare();
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            };

            const handleRestartQuiz = () => {
                setCurrentIndex(0);
                setSelectedOption(null);
                setIsSubmitted(false);
                setScore(0);
                setStreak(0);
            };

            const currentQ = QUIZ_QUESTIONS[currentIndex];

            if (quizCompleted) {
                return (
                    <div className="glass-card max-w-2xl mx-auto rounded-3xl p-8 border border-sky-100 text-center space-y-6">
                        <div className="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
                            <i data-lucide="trophy" className="w-10 h-10"></i>
                        </div>
                        <div className="space-y-2">
                            <h2 className="font-display font-bold text-2xl text-slate-800">
                                Kuis Kilat Asesmen Selesai!
                            </h2>
                            <p className="text-sm text-slate-600">
                                Luar biasa <span className="font-semibold text-sky-700">{user.nama}</span>! Berikut adalah capaian nilai Anda:
                            </p>
                        </div>

                        <div className="bg-gradient-to-br from-sky-50 to-indigo-50 p-6 rounded-2xl border border-sky-100 flex items-center justify-around">
                            <div>
                                <div className="text-xs text-slate-500 font-medium">Total Skor Kuis</div>
                                <div className="text-4xl font-display font-bold text-sky-600">{quizScore} / 100</div>
                            </div>
                            <div className="h-10 w-px bg-slate-200"></div>
                            <div>
                                <div className="text-xs text-slate-500 font-medium">Status Pemahaman</div>
                                <div className="text-sm font-bold text-emerald-600 mt-1">
                                    {quizScore >= 80 ? 'Sangat Menguasai 🎉' : quizScore >= 60 ? 'Cukup Baik 👍' : 'Perlu Diulas Kembali 📖'}
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-3">
                            <button 
                                onClick={handleRestartQuiz}
                                className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-2xl text-sm transition-colors flex items-center justify-center gap-2"
                            >
                                <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                                Coba Kuis Lagi
                            </button>
                            <button 
                                onClick={() => {
                                    sound.playClick();
                                    const event = new CustomEvent('navigate', { detail: 'workbench' });
                                    window.dispatchEvent(event);
                                }}
                                className="flex-1 py-3 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-2xl text-sm shadow-md shadow-sky-200 transition-colors flex items-center justify-center gap-2"
                            >
                                Lanjut ke Lab AI Soal
                                <i data-lucide="arrow-right" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    {/* PROGRESS BAR & SCOREBOARD */}
                    <div className="glass-card rounded-2xl p-4 border border-sky-100 flex items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-sky-100 text-sky-700 flex items-center justify-center font-display font-bold text-sm">
                                {currentIndex + 1}/10
                            </div>
                            <div>
                                <div className="text-xs font-semibold text-slate-500">Kuis Kilat Asesmen SD</div>
                                <div className="text-sm font-bold text-slate-800">Soal Ke-{currentIndex + 1}</div>
                            </div>
                        </div>

                        {/* TIMER */}
                        <div className={`flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-bold ${timeLeft <= 5 ? 'bg-rose-50 text-rose-600 border-rose-200 ring-2 ring-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200'}`}>
                            <i data-lucide="timer" className="w-4 h-4"></i>
                            <span>{timeLeft} Detik</span>
                        </div>

                        {/* STREAK & SCORE */}
                        <div className="flex items-center gap-3">
                            {streak > 1 && (
                                <div className="hidden sm:flex items-center gap-1 text-xs font-bold text-amber-600 bg-amber-100 px-2.5 py-1 rounded-full">
                                    <i data-lucide="flame" className="w-3.5 h-3.5 fill-current"></i>
                                    Streak x{streak}!
                                </div>
                            )}
                            <div className="text-right">
                                <div className="text-[10px] text-slate-400 font-semibold">SKOR TERKUMPUL</div>
                                <div className="text-lg font-display font-bold text-sky-600">{score}</div>
                            </div>
                        </div>
                    </div>

                    {/* QUESTION CARD */}
                    <div className="glass-card rounded-3xl p-6 sm:p-8 border border-sky-100 space-y-6">
                        <div className="space-y-3">
                            <div className="inline-block text-xs font-semibold px-2.5 py-1 rounded-lg bg-sky-100 text-sky-800">
                                Kaidah & Pedoman Penulisan Soal SD
                            </div>
                            <h3 className="font-display font-semibold text-lg sm:text-xl text-slate-800 leading-snug">
                                {currentQ.question}
                            </h3>
                        </div>

                        {/* OPTIONS LIST */}
                        <div className="space-y-3">
                            {currentQ.options.map((optionText, idx) => {
                                let optionStyle = "bg-white border-slate-200 hover:border-sky-300 hover:bg-sky-50/50 text-slate-700";
                                
                                if (selectedOption === idx) {
                                    optionStyle = "bg-sky-100 border-sky-500 text-sky-900 font-medium ring-2 ring-sky-200";
                                }

                                if (isSubmitted) {
                                    if (idx === currentQ.correct) {
                                        optionStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 font-semibold ring-2 ring-emerald-200";
                                    } else if (selectedOption === idx) {
                                        optionStyle = "bg-rose-100 border-rose-500 text-rose-900 font-medium";
                                    } else {
                                        optionStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                                    }
                                }

                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleSelectOption(idx)}
                                        disabled={isSubmitted}
                                        className={`w-full p-4 rounded-2xl border text-left text-sm transition-all flex items-start gap-3 ${optionStyle}`}
                                    >
                                        <span className={`w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${selectedOption === idx ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                            {String.fromCharCode(65 + idx)}
                                        </span>
                                        <span className="flex-1">{optionText}</span>
                                        {isSubmitted && idx === currentQ.correct && (
                                            <i data-lucide="check-circle" className="w-5 h-5 text-emerald-600 shrink-0"></i>
                                        )}
                                        {isSubmitted && selectedOption === idx && idx !== currentQ.correct && (
                                            <i data-lucide="x-circle" className="w-5 h-5 text-rose-600 shrink-0"></i>
                                        )}
                                    </button>
                                );
                            })}
                        </div>

                        {/* EXPLANATION BOX */}
                        {isSubmitted && (
                            <div className={`p-4 rounded-2xl border text-xs sm:text-sm leading-relaxed space-y-1 animate-fadeIn ${selectedOption === currentQ.correct ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`}>
                                <div className="font-bold flex items-center gap-1.5">
                                    <i data-lucide="info" className="w-4 h-4"></i>
                                    {selectedOption === currentQ.correct ? 'Jawaban Anda Tepat!' : 'Pembahasan & Kaidah:'}
                                </div>
                                <p>{currentQ.explanation}</p>
                            </div>
                        )}

                        {/* ACTION BUTTON */}
                        <div className="pt-2 flex justify-end">
                            {!isSubmitted ? (
                                <button
                                    onClick={handleAnswerSubmit}
                                    disabled={selectedOption === null}
                                    className={`px-6 py-3 rounded-2xl font-bold text-sm shadow-md transition-all flex items-center gap-2 ${selectedOption !== null ? 'bg-sky-600 hover:bg-sky-700 text-white shadow-sky-200' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                >
                                    Kunci Jawaban
                                    <i data-lucide="lock" className="w-4 h-4"></i>
                                </button>
                            ) : (
                                <button
                                    onClick={handleNextQuestion}
                                    className="px-6 py-3 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold rounded-2xl text-sm shadow-md shadow-sky-200 transition-all flex items-center gap-2"
                                >
                                    {currentIndex < QUIZ_QUESTIONS.length - 1 ? 'Soal Berikutnya' : 'Lihat Hasil Akhir'}
                                    <i data-lucide="arrow-right" className="w-4 h-4"></i>
                                </button>
                            )}
                        </div>
                    </div>
                </div>

        // --- MODUL 2: LAB KREATOR & PEMERIKSA SOAL AUTOMATIS (GEMINI AI INTEGRATION) ---

            const [stem, setStem] = useState('Berdasarkan siklus air di atas, apa yang akan terjadi jika area resapan air di perkotaan digantikan oleh pemukiman padat bertembok semen?');
            
            // Options state (Dynamic: 3 options for Class 1-3, 4 options for Class 4-6)
            const isLowerClass = user.kelas.includes('1') || user.kelas.includes('2') || user.kelas.includes('3');
            
            const [optionA, setOptionA] = useState('Air hujan akan lebih cepat meresap ke dalam tanah');
            const [optionB, setOptionB] = useState('Terjadi genangan air dan risiko banjir saat hujan deras');
            const [optionC, setOptionC] = useState('Proses penguapan air laut akan terhenti seketika');
            const [optionD, setOptionD] = useState('Jumlah air hujan yang turun akan menjadi berlipat ganda');

            const [kunci, setKunci] = useState('B');
            const [rubrik, setRubrik] = useState('Skor 2: Menjawab terjadi banjir karena semen menghambat resapan. Skor 1: Menjawab banjir tanpa penjelasan resapan.');

            const [loading, setLoading] = useState(false);
            const [evaluationResult, setEvaluationResult] = useState(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [evaluationResult, jenisSoal]);

            // Call Gemini API to evaluate question quality
            const handleAnalyzeQuestion = async () => {
                if (!stem.trim()) {
                    alert("Mohon isi Pokok Soal (Stem) terlebih dahulu!");
                    return;
                }

                sound.playClick();
                setLoading(true);
                setEvaluationResult(null);

                const promptText = `
                Berindaklah sebagai Pakar Evaluasi dan Asesmen Pendidikan SD Kementerian Pendidikan.
                Analisislah soal sekolah dasar berikut secara cermat berdasarkan standar kaidah penulisan soal resmi SD:

                - Kelas Target: ${user.kelas}
                - Mata Pelajaran: ${mapel}
                - Capaian Pembelajaran / KD: ${capaian}
                - Jenis Soal: ${jenisSoal}
                - Stimulus: ${stimulus}
                - Pokok Soal (Stem): ${stem}
                ${jenisSoal === 'Pilihan Ganda' ? `
                - Opsi Jawaban:
                  A. ${optionA}
                  B. ${optionB}
                  C. ${optionC}
                  ${!isLowerClass ? `D. ${optionD}` : ''}
                - Kunci Jawaban: ${kunci}
                ` : `
                - Kunci/Rubrik Penskoran: ${rubrik}
                `}

                Evaluasi kriteria berikut dalam format JSON persis:
                1. ukrkAnalysis: Penilaian keberadaan Urgensi, Kontinuitas, Relevansi, dan Keterpakaian.
                2. hotsStatus: Apakah tergolong L1 (Hafalan), L2 (Aplikasi), atau L3 (Penalaran/HOTS)?
                3. stimulusFunctionality: Apakah stimulus berfungsi secara mutlak untuk menjawab soal atau sekadar hiasan?
                4. languageConstruction: Kesesuaian bahasa SD, bebas negasi ganda, dan kejelasan stem.
                5. score: Skor kualitas soal keseluruhan dari 0 hingga 100.
                6. recommendations: Array berisi 2-3 saran konkret perbaikan soal.
                `;

                const systemPrompt = "Anda adalah Pakar Asesmen SD Indonesia. Kembalikan HANYA format JSON valid tanpa teks markdown pembuka/penutup tambahan.";

                const apiKey = ""; // Canvas provides runtime API key
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "OBJECT",
                                    properties: {
                                        ukrkAnalysis: { type: "STRING" },
                                        hotsStatus: { type: "STRING" },
                                        stimulusFunctionality: { type: "STRING" },
                                        languageConstruction: { type: "STRING" },
                                        score: { type: "NUMBER" },
                                        recommendations: {
                                            type: "ARRAY",
                                            items: { type: "STRING" }
                                        }
                                    },
                                    required: ["ukrkAnalysis", "hotsStatus", "stimulusFunctionality", "languageConstruction", "score", "recommendations"]
                                }
                            }
                        })
                    });

                    const data = await response.json();
                    let parsedJSON = null;

                    if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                        const rawText = data.candidates[0].content.parts[0].text;
                        parsedJSON = JSON.parse(rawText);
                    } else {
                        throw new Error("Respon API tidak lengkap");
                    }

                    setEvaluationResult(parsedJSON);
                    onQuestionEvaluated(parsedJSON.score, { stem, mapel, jenisSoal });
                    sound.playFanfare();
                } catch (err) {
                    console.warn("Menggunakan Evaluator Heuristik Lokal:", err);
                    
                    // HEURISTIC LOCAL EVALUATOR FALLBACK
                    const hasStimulus = stimulus.length > 20;
                    const isLongStem = stem.length > 25;

                        hotsStatus: hasStimulus ? "L3 (Penalaran / HOTS) - Menguji daya analisis murid" : "L1 (Pengetahuan/LOTS) - Cenderung hafalan langsung",
                        stimulusFunctionality: hasStimulus ? "Stimulus fungsional dan mengandung konteks data untuk menjawab" : "Stimulus minim/sekadar tempelan",
                        languageConstruction: "Kalimat sudah sesuai dengan tingkat perkembangan murid SD dan cukup komunikatif.",
                        score: calculatedScore,
                        recommendations: [
                            "Pastikan panjang opsi pilihan ganda relatif homogen dan seimbang.",
                            "Gunakan stimulus berbasis studi kasus nyata kehidupan sehari-hari anak SD."
                        ]
                    };

                    setEvaluationResult(fallbackResult);

                    sound.playFanfare();

                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    placeholder="Cari nama guru / sekolah..."
                                    className="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                />
                            </div>
                            <div className="text-xs text-slate-500 font-medium">
                                Menampilkan {filteredList.length} peserta
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-slate-700">
                                <thead className="bg-sky-50/80 text-sky-900 font-display font-bold border-b border-sky-100">
                                    <tr>
                                        <th className="p-3.5 rounded-l-xl text-center">Posisi</th>
                                        <th className="p-3.5">Nama Guru & Instansi</th>
                                        <th className="p-3.5 text-center">Kelas</th>
                                        <th className="p-3.5 text-center">Skor Kuis</th>
                                        <th className="p-3.5 text-center">Skor Soal AI</th>
                                        <th className="p-3.5 text-center">Total Skor</th>
                                        <th className="p-3.5 rounded-r-xl text-center">Badge Gelar</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredList.map((item, idx) => {
                                        const isCurrent = currentUser && item.nama === currentUser.nama;
                                        
                                        return (
                                            <tr key={idx} className={`transition-colors ${isCurrent ? 'bg-sky-100/60 font-semibold' : 'hover:bg-slate-50'}`}>
                                                <td className="p-3.5 text-center font-display font-bold text-sm">
                                                    {idx === 0 ? '🥇 1' : idx === 1 ? '🥈 2' : idx === 2 ? '🥉 3' : idx + 1}
                                                </td>
                                                <td className="p-3.5">
                                                    <div className="font-bold text-slate-800">{item.nama}</div>
                                                    <div className="text-[11px] text-slate-500">{item.instansi}</div>
                                                </td>
                                                <td className="p-3.5 text-center">
                                                    <span className="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-medium text-[11px]">
                                                        {item.kelas}
                                                    </span>
                                                </td>
                                                <td className="p-3.5 text-center font-bold text-sky-600">{item.skorKuis}</td>
                                                <td className="p-3.5 text-center font-bold text-indigo-600">{item.skorSoal}</td>
                                                <td className="p-3.5 text-center font-display font-bold text-sm text-slate-800">{item.totalSkor}</td>
                                                <td className="p-3.5 text-center">
                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1 ${
                                                        item.badge === 'Maestro HOTS SD' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                                                        item.badge === 'Pakar UKRK' ? 'bg-indigo-100 text-indigo-800 border border-indigo-200' :
                                                        'bg-emerald-100 text-emerald-800 border border-emerald-200'
                                                    }`}>
                                                        <i data-lucide="award" className="w-3 h-3"></i>
                                                        {item.badge}
                                                    </span>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* MODAL GOOGLE SHEETS SETUP */}
                    {showWebhookModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-card bg-white max-w-lg w-full rounded-3xl p-6 space-y-5 border border-slate-200 shadow-2xl animate-fadeIn">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                                    <div className="flex items-center gap-2 text-emerald-700 font-display font-bold text-lg">
                                        <i data-lucide="file-spreadsheet" className="w-5 h-5"></i>
                                        Integrasi Google Sheets
                                    </div>
                                    <button onClick={() => setShowWebhookModal(false)} className="p-1 text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <div className="text-xs text-slate-600 space-y-3 leading-relaxed">
                                    <p>
                                        Hubungkan aplikasi ke Google Spreadsheet Anda menggunakan <strong>Google Apps Script Webhook</strong>.
                                    </p>
                                    <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 font-mono text-[11px] overflow-x-auto">
                                        <code>
                                            function doPost(e) &#123;<br/>
                                            &nbsp;&nbsp;var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();<br/>
                                            &nbsp;&nbsp;var data = JSON.parse(e.postData.contents);<br/>
                                            &nbsp;&nbsp;sheet.appendRow([data.nama, data.kelas, data.instansi, data.skorKuis, data.skorSoal, data.totalSkor, new Date()]);<br/>
                                            &nbsp;&nbsp;return ContentService.createTextOutput("success");<br/>
                                            &#125;
                                        </code>
                                    </div>
                                </div>

                                <form onSubmit={handleSaveWebhook} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">
                                            URL Webhook Google Apps Script Deployment
                                        </label>
                                        <input 
                                            type="url" 
                                            value={inputUrl}
                                            onChange={(e) => setInputUrl(e.target.value)}
                                            placeholder="https://script.google.com/macros/s/.../exec"
                                            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                        />
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowWebhookModal(false)}
                                            className="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 font-semibold text-xs"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow-md shadow-emerald-200"
                                        >
                                            Simpan URL Webhook
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- CERTIFICATE MODULE COMPONENT ---
        function CertificateModule({ user, quizScore, createdQuestionScore }) {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, []);

            const totalScore = (quizScore || 0) + (createdQuestionScore || 0);

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6 animate-fadeIn">
                    <div className="flex items-center justify-between">
                        <div>
                            <h2 className="font-display font-bold text-xl text-slate-800">
                                Sertifikat Maestro Asesmen SD
                            </h2>
                            <p className="text-xs text-slate-600">
                                Bukti kelulusan dan apresiasi kompetensi penulisan soal berstandar resmi
                            </p>
                        </div>
                        <button 
                            onClick={handlePrint}
                            className="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl text-xs shadow-md transition-colors flex items-center gap-2"
                        >
                            <i data-lucide="printer" className="w-4 h-4"></i>
                            Cetak / Simpan PDF
                        </button>
                    </div>

                    {/* CERTIFICATE DESIGN */}
                    <div className="bg-white p-8 sm:p-12 rounded-3xl border-8 border-sky-100 shadow-2xl space-y-8 relative overflow-hidden text-center">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-sky-200 rounded-full blur-2xl opacity-40 pointer-events-none"></div>
                        <div className="absolute bottom-0 left-0 w-32 h-32 bg-amber-200 rounded-full blur-2xl opacity-40 pointer-events-none"></div>

                        <div className="space-y-2">
                            <div className="inline-flex items-center gap-1.5 text-xs font-bold text-sky-800 uppercase tracking-widest bg-sky-50 px-3 py-1 rounded-full border border-sky-200">
                                <i data-lucide="award" className="w-4 h-4 text-amber-500"></i>
                                Sertifikat Kelulusan Gamifikasi
                            </div>
                            <h1 className="font-display font-bold text-3xl sm:text-4xl text-slate-800 tracking-tight">
                                MAESTRO ASESMEN SD
                            </h1>
                            <p className="text-xs text-slate-500">Diberikan sebagai penghargaan atas pencapaian kompetensi dalam:</p>
                        </div>

                        <div className="py-2">
                            <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sertifikat ini diberikan kepada:</p>
                            <h2 className="font-display font-bold text-2xl sm:text-3xl text-sky-700 underline decoration-sky-300 underline-offset-8 mt-1">
                                {user.nama}
                            </h2>
                            <p className="text-sm font-medium text-slate-600 mt-2">
                                {user.instansi} &bull; Guru {user.kelas}
                            </p>
                        </div>

                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 max-w-lg mx-auto grid grid-cols-3 gap-3 text-center">
                            <div>
                                <div className="text-[10px] text-slate-400 font-semibold">SKOR KUIS</div>
                                <div className="text-lg font-bold text-sky-600 font-display">{quizScore || 0} / 100</div>
                            </div>
                            <div className="border-x border-slate-200">
                                <div className="text-[10px] text-slate-400 font-semibold">SKOR LAB AI SOAL</div>
                                <div className="text-lg font-bold text-indigo-600 font-display">{createdQuestionScore || 0} / 100</div>
                            </div>
                            <div>
                                <div className="text-[10px] text-slate-400 font-semibold">TOTAL Poin</div>
                                <div className="text-lg font-bold text-emerald-600 font-display">{totalScore}</div>
                            </div>
                        </div>

                        <div className="pt-6 flex justify-around items-end text-xs text-slate-500">
                            <div>
                                <div className="font-semibold text-slate-700">Tim Pengembang Asesmen</div>
                                <div className="h-10"></div>
                                <div className="border-t border-slate-300 pt-1 font-medium">Panitia Asesmen SD</div>
                            </div>
                            <div className="w-16 h-16 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center mx-auto border-2 border-amber-300 shadow-inner">
                                <i data-lucide="award" className="w-8 h-8"></i>
                            </div>
                            <div>
                                <div className="font-semibold text-slate-700">Tanggal Menerima</div>
                                <div className="h-10 font-display font-bold text-sky-700 flex items-center justify-center">
                                    {new Date().toLocaleDateString('id-ID')}
                                </div>
                                <div className="border-t border-slate-300 pt-1 font-medium">Tanda Tangan Otomatis</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render React DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
